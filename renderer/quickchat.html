<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'none'">
  <title>Nexus Quick Chat</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="chatview.css">
  <link rel="stylesheet" href="quickchat.css">
</head>
<body>
  <div class="qc" id="qc">
    <div class="qc-head">
      <svg class="hex" viewBox="0 0 24 24"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/><circle cx="12" cy="12" r="3.2"/></svg>
      <button class="pill" id="agentPill" title="Switch agent (⌘1–⌘4)"><i id="pillDot"></i><span id="pillName">PARAGON</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="chat-pick" id="chatPick" title="Choose which chat to type to"><span id="chatPickName">New chat</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="chip" id="omniChip" title="OmniBrief (⌘B)"><i></i>OMNIBRIEF</button>
      <button class="chip look" id="lookChip" title="Look at the window you were using and attach it"><i></i>LOOK</button>
      <button class="chip hw" id="hwChip" title="Homework helper: looks at your screen and gives hints one at a time" hidden><i></i>HOMEWORK</button>
      <span class="qc-status" id="qcStatus"></span>
      <span class="grip" title="Drag to move">⋮⋮</span>
      <button class="hbtn" id="btnNew" title="New chat (⌘N)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="hbtn" id="btnOpen" title="Open in full chat"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      <button class="hbtn" id="btnClose" title="Hide (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="agent-list" id="agentList" hidden></div>
    <div class="chat-list" id="chatList" hidden>
      <input id="chatSearch" placeholder="Search chats…" spellcheck="false">
      <div id="chatItems"></div>
    </div>
    <div class="clip-list" id="clipList" hidden>
      <div class="cl-head"><span>CLIPBOARD HISTORY</span><small>click to paste · ⇧-click to attach</small><button id="clipClear">CLEAR</button></div>
      <div id="clipItems"></div>
    </div>
    <div class="explain-bar" id="explainBar" hidden>
      <div class="xb-head"><span class="xb-tag">HIGHLIGHTED</span><span class="xb-app" id="xbApp"></span><button class="xb-x" id="xbClose" title="Clear">×</button></div>
      <div class="xb-preview" id="xbPreview"></div>
      <div class="xb-chips" id="xbChips"></div>
    </div>
    <div class="ax-help" id="axHelp" hidden>
      <b>Turn on Accessibility</b><span>Explain this reads the text you highlight. In System Settings → Privacy &amp; Security → Accessibility, switch on <em>Nexus '28</em>, then press the hotkey again.</span>
      <button id="axOpen">OPEN SETTINGS</button>
    </div>
    <div class="att-tray" id="attTray" hidden></div>
    <div class="qc-input">
      <span class="glyph">&gt;</span>
      <textarea id="input" rows="1" placeholder="Ask Nexus anything…" spellcheck="false"></textarea>
      <button class="hbtn clipb" id="btnClip" title="Clipboard history"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg></button>
      <button class="hbtn attach" id="btnAttach" title="Attach files or images (or drop them here)"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></button>
      <button class="hbtn mic" id="btnMic" title="Dictate (⌘D)"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="send" id="btnSend">SEND</button>
    </div>
    <div class="thread" id="thread"></div>
  </div>
  <script src="markdown.js"></script>
  <script src="theme.js"></script>
  <script src="widgets.js"></script>
  <script src="chatctx.js"></script>
  <script src="voicecap.js"></script>
  <script src="chatview.js"></script>
  <script src="quickchat.js"></script>
</body>
</html>
