<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
  <title>Mind map of your chats</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="mindmap.css">
</head>
<body>
  <header class="mm-top">
    <b>🗺 Mind map of your chats</b><span class="mm-sub" id="sub"></span>
    <span class="sp"></span>
    <input id="q" type="search" placeholder="Find a chat or a topic" autocomplete="off" spellcheck="false">
    <button id="fit" title="Fit everything in view">⤢ Fit</button>
  </header>
  <div class="mm-chips" id="chips"></div>
  <div class="mm-stage" id="stage">
    <svg id="svg" aria-label="Your chats as a mind map. Drag to move around, scroll to zoom, click a chat to open it."><g id="world"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div class="mm-tip" id="tip" hidden></div>
    <div class="mm-empty" id="empty" hidden>Your chats show up here once you've had a few. Chats in the same Space, or about the same things, are joined together.</div>
  </div>
  <footer class="mm-legend"><span><i class="lg chat"></i>Chat (bigger = longer)</span><span><i class="lg space"></i>Space</span><span><i class="lg topic"></i>Topic</span><span><i class="lg sim"></i>About the same things</span><span><i class="lg link"></i>Linked chats</span><span class="sp"></span><span class="hint">Drag to move · scroll to zoom · click a chat to open it</span></footer>
  <script src="theme.js"></script>
  <script src="mindmap.js"></script>
</body>
</html>
