# Pushing a tag like v1.0.1 builds Nexus '28 on a Mac runner and publishes a GitHub Release with the DMG + zip.
# The app's update checker reads that release.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-26   # Xcode 26's actool compiles the Liquid Glass app icon (assets/Nexus.icon)
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # ad-hoc build, no Apple Developer ID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # The layered macOS 26 icon (tints with Light / Dark / Tinted / Clear like the built-in apps). If actool can't
        # compile it, build with the flat icon instead of failing the release.
        run: |
          npm run build:helper
          xcrun actool --version || true
          npx electron-builder --mac --arm64 --publish never -c.mac.icon=assets/Nexus.icon || {
            echo "::warning::Liquid Glass icon failed to compile; building with the flat icon (assets/icon.png)."
            rm -rf dist
            npx electron-builder --mac --arm64 --publish never
          }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus '28 ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
          # Tags with a dash (v1.8.0-beta.1) are prereleases: only beta testers and admins are offered them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## Install
            1. Open the DMG and drag **Nexus '28** to Applications.
            2. Run once in Terminal:
            ```
            xattr -cr "/Applications/Nexus '28.app"
            codesign --force --deep --sign - "/Applications/Nexus '28.app"
            ```
            Already have Nexus '28? Download, replace the app, and run the two commands again. Settings, chats and keys are kept.
