<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04100b">
<title>Nexus Admin</title>
<link rel="icon" type="image/png" href="../companion/favicon.png">
<!-- Nexus '28 admin portal. Anyone can load this page, but every list and action goes through Supabase row-level
     security and admin-only functions (is_admin()), so it only works for accounts in public.admin_roles. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --accent: #3dffa0; --rgb: 61,255,160; --bg: #04100b; --panel: #0b1f17; --panel2: #102a20; --text: #e2fff1; --muted: #7aa894; --danger: #ff6b7d; --gold: #ffd36b; --cyan: #5ce1ff;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
  body { background: radial-gradient(ellipse at 10% -10%, rgba(var(--rgb), .12), transparent 50%), var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid rgba(var(--rgb), .14); position: sticky; top: 0; background: rgba(4,16,11,.9); backdrop-filter: blur(10px); z-index: 2; }
  header img { width: 30px; height: 30px; border-radius: 8px; }
  header b { font: 700 13px var(--mono); letter-spacing: .26em; } header small { color: var(--muted); font-size: 12px; display: block; }
  header .who { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); }
  .wrap { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 60px); }
  nav { border-right: 1px solid rgba(var(--rgb), .1); padding: 14px 10px; position: sticky; top: 59px; height: calc(100vh - 59px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  nav button { text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  nav button:hover { background: rgba(var(--rgb), .06); color: var(--text); } nav button.on { background: rgba(var(--rgb), .12); color: var(--accent); }
  nav .n { margin-left: auto; background: var(--gold); color: #1b1300; border-radius: 9px; font: 700 11px var(--sans); padding: 0 6px; }
  main { padding: 22px 26px 60px; max-width: 1100px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h1 + p { color: var(--muted); margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid rgba(var(--rgb), .12); border-radius: 14px; padding: 14px; } .stat b { display: block; font-size: 26px; color: var(--accent); } .stat span { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid rgba(var(--rgb), .12); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .field { border: 1px solid rgba(var(--rgb), .25); background: rgba(0,0,0,.3); border-radius: 10px; padding: 8px 11px; outline: none; color-scheme: dark; }
  .field:focus { border-color: var(--accent); } textarea.field { width: 100%; resize: vertical; }
  .btn { border: 1px solid rgba(var(--rgb), .35); background: rgba(var(--rgb), .06); color: var(--accent); border-radius: 10px; padding: 7px 13px; cursor: pointer; }
  .btn:hover { background: rgba(var(--rgb), .14); } .btn.primary { background: var(--accent); color: #032313; border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--danger); border-color: rgba(255, 107, 125, .4); background: rgba(255, 107, 125, .06); } .btn:disabled { opacity: .4; cursor: default; }
  .pill { display: inline-block; font: 600 11px var(--mono); letter-spacing: .06em; padding: 1px 8px; border-radius: 8px; border: 1px solid currentColor; }
  .p-pending { color: var(--gold); } .p-approved { color: var(--accent); } .p-declined { color: var(--danger); }
  .muted { color: var(--muted); font-size: 13px; } .err { color: var(--danger); } .ok { color: var(--accent); }
  .req { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; }
  .req .who b { font-size: 16px; } .req q { display: block; margin: 6px 0 0; color: var(--text); quotes: none; white-space: pre-wrap; }
  .req .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 150px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(var(--rgb), .08); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .tabsub { display: flex; gap: 6px; margin-bottom: 12px; } .tabsub button { border: 1px solid rgba(var(--rgb), .2); background: none; color: var(--muted); border-radius: 12px; padding: 4px 12px; cursor: pointer; }
  .tabsub button.on { background: var(--accent); color: #032313; border-color: var(--accent); }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 14px; } .kv span:nth-child(odd) { color: var(--muted); }
  .login { max-width: 380px; margin: 70px auto; } .login .card { display: grid; gap: 10px; padding: 22px; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel2); border: 1px solid rgba(var(--rgb), .4); border-radius: 12px; padding: 10px 16px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .empty { text-align: center; color: var(--muted); padding: 36px; }
  /* Admin chat (v2.1) */
  .chat { display: grid; grid-template-columns: 230px 1fr; gap: 12px; height: calc(100vh - 210px); min-height: 420px; }
  .rooms { background: var(--panel); border: 1px solid rgba(var(--rgb), .12); border-radius: 14px; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .rooms button { display: flex; align-items: center; gap: 9px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--text); }
  .rooms button:hover { background: rgba(var(--rgb), .06); } .rooms button.on { background: rgba(var(--rgb), .14); }
  .rooms .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--sans); color: #032313; flex: none; }
  .rooms .nm { flex: 1; min-width: 0; } .rooms .nm small { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rooms .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none; }
  .rooms h4 { margin: 10px 10px 4px; font: 600 11px var(--mono); letter-spacing: .14em; color: var(--muted); }
  .thread { background: var(--panel); border: 1px solid rgba(var(--rgb), .12); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; }
  .thread .top { padding: 10px 14px; border-bottom: 1px solid rgba(var(--rgb), .1); display: flex; align-items: center; gap: 10px; } .thread .top b { flex: 1; }
  .thread .top .back { display: none; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .m { max-width: 76%; align-self: flex-start; } .m.me { align-self: flex-end; text-align: right; }
  .m .bub { display: inline-block; text-align: left; background: var(--panel2); border-radius: 14px 14px 14px 4px; padding: 7px 12px; white-space: pre-wrap; word-wrap: break-word; }
  .m.me .bub { background: var(--accent); color: #032313; border-radius: 14px 14px 4px 14px; }
  .m .by { font-size: 11px; color: var(--muted); margin: 6px 4px 1px; } .m.cont .by { display: none; }
  .day { text-align: center; color: var(--muted); font-size: 11px; margin: 10px 0 4px; letter-spacing: .06em; }
  .compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid rgba(var(--rgb), .1); }
  .compose textarea { flex: 1; resize: none; height: 40px; max-height: 120px; }
  .live { font: 600 10px var(--mono); letter-spacing: .1em; color: var(--accent); } .live.off { color: var(--muted); }
  @media (max-width: 760px) {
    header { padding: 10px 14px; } header .who { font-size: 11px; }
    .wrap { grid-template-columns: 1fr; min-height: 0; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; flex-direction: row; overflow-x: auto; scrollbar-width: none; border: 0; border-top: 1px solid rgba(var(--rgb), .14);
      background: rgba(4,16,11,.94); backdrop-filter: blur(14px); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
    nav::-webkit-scrollbar { display: none; } nav > div { display: none; }
    nav button { white-space: nowrap; flex: none; font-size: 13px; padding: 8px 11px; }
    main { padding: 16px 14px calc(90px + env(safe-area-inset-bottom)); }
    h1 { font-size: 20px; } .grid { grid-template-columns: repeat(2, 1fr); } .stat b { font-size: 22px; }
    .req { grid-template-columns: 1fr; } .req .acts { flex-direction: row; flex-wrap: wrap; min-width: 0; } .req .acts > * { flex: 1 1 120px; }
    .kv { grid-template-columns: 1fr; gap: 0; } .kv span:nth-child(even) { margin-bottom: 8px; }
    .field, .btn { min-height: 40px; } .row > .field { flex: 1 1 100%; } input.field, select.field, textarea.field { font-size: 16px; }
    .tabsub { overflow-x: auto; scrollbar-width: none; }
    table, tbody, tr, td { display: block; width: 100%; } table tr:first-child:has(th) { display: none; }
    tr { border-bottom: 1px solid rgba(var(--rgb), .1); padding: 8px 0; } td { border: 0; padding: 3px 0; } td[data-l]::before { content: attr(data-l); display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .toast { left: 14px; right: 14px; bottom: calc(80px + env(safe-area-inset-bottom)); text-align: center; }
    nav { height: auto; top: auto; }
    .chat { grid-template-columns: 1fr; height: calc(100dvh - 250px); } main:has(.chat.open) > h1, main:has(.chat.open) > p { display: none; } .chat.open { height: calc(100dvh - 160px - env(safe-area-inset-bottom)); }
    .chat.open .rooms { display: none; } .chat:not(.open) .thread { display: none; } .thread .top .back { display: inline-block; }
    .m { max-width: 88%; }
  }
</style>
</head>
<body>
<header><img src="../companion/icon-192.png" alt=""><div><b>NEXUS ADMIN</b><small>Nexus '28 · N28C</small></div><div class="who" id="who"></div></header>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const sb = supabase.createClient('https://yzbnxpkuhlxsuwzbjifx.supabase.co', 'sb_publishable_LY-EZORCvEQqW6AeQC5a8w_Z7wmeyjn', { auth: { persistSession: true, autoRefreshToken: true } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = t => t ? new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
function toast(t, bad) { const el = $('toast'); el.textContent = t; el.style.borderColor = bad ? 'var(--danger)' : ''; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800); }
const ERR = { not_admin: 'Admins only.', not_high_admin: 'Only high-admins can do that.', user_not_found: 'No account with that email.', invalid_level: 'Pick a valid level.', not_found: 'Not found.' };
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw new Error(error.message); if (data && data.success === false) throw new Error(ERR[data.error] || data.error); return data; }
const A = { user: null, level: '', tab: location.hash.slice(1) || 'requests', reqFilter: 'pending', pending: 0 };
const TABS = [['overview', '◎ Overview'], ['requests', '🧪 Beta requests'], ['users', '👤 Users'], ['flags', '⚑ Feature flags'], ['announce', '📣 Announcements'], ['maint', '🛠 Maintenance'], ['chat', '💬 Admin chat'], ['audit', '📜 Audit log']];

function shell() {
  $('app').innerHTML = `<div class="wrap"><nav id="nav">${TABS.map(([k, l]) => `<button data-tab="${k}" class="${A.tab === k ? 'on' : ''}">${l}${k === 'requests' && A.pending ? `<span class="n">${A.pending}</span>` : ''}${k === 'chat' && A.unread ? `<span class="n">${A.unread}</span>` : ''}</button>`).join('')}
    <div style="flex:1"></div><button id="out">Sign out</button></nav><main id="main"></main></div>`;
  $('nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.id === 'out') return sb.auth.signOut().then(() => location.reload()); A.tab = b.dataset.tab; history.replaceState(null, '', '#' + A.tab); shell(); };
  if (A.tab !== 'chat') C.open = false;
  if (innerWidth <= 760) document.querySelector('#nav .on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  ({ overview, requests, users, flags, announce, maint, audit, chat })[A.tab]?.().catch(e => { $('main').innerHTML = `<div class="card err">${esc(e.message)}</div>`; });
}
const main = html => { $('main').innerHTML = html; labelTables(); };
// On phones the tables become cards: each cell shows its column name.
function labelTables() { $('main').querySelectorAll('table').forEach(t => { const hs = [...t.querySelectorAll('tr:first-child th')].map(h => h.textContent.trim()); if (!hs.length) return;
  t.querySelectorAll('tr').forEach(r => [...r.children].forEach((c, i) => { if (c.tagName === 'TD' && hs[i] && !c.hasAttribute('colspan')) c.dataset.l = hs[i]; })); }); }

// ---------- overview
async function overview() {
  main('<h1>Overview</h1><p>Loading…</p>');
  let o; try { o = await rpc('admin_overview'); } catch (e) { return main(`<h1>Overview</h1><div class="card err">${esc(e.message)}${/admin_overview/.test(e.message) ? ' Run supabase/nexus-v2.0.sql first.' : ''}</div>`); }
  A.pending = o.pending_requests;
  const s = (n, l) => `<div class="stat"><b>${esc(n)}</b><span>${esc(l)}</span></div>`;
  main(`<h1>Overview</h1><p>Your Nexus at a glance.</p><div class="grid">${s(o.users, 'accounts')}${s(o.new_users_7d, 'new this week')}${s(o.beta_testers, 'beta testers')}${s(o.pending_requests, 'beta requests waiting')}${s(o.admins, 'admins & mods')}${s(o.moderated, 'suspended / banned')}${s(o.shared_spaces, 'Shared Spaces')}${s(o.phone_users_24h, 'Macs with N28C (24 h)')}</div>
    ${o.pending_requests ? `<div class="card"><h3>🧪 ${o.pending_requests} beta request${o.pending_requests === 1 ? '' : 's'} waiting</h3><button class="btn primary" data-go="requests">Review them</button></div>` : ''}`);
  $('main').onclick = e => { const g = e.target.closest('[data-go]'); if (g) { A.tab = g.dataset.go; shell(); } };
}

// ---------- beta requests
async function requests() {
  main('<h1>Beta requests</h1><p>Loading…</p>');
  let q = sb.from('beta_requests').select('*').order('created_at', { ascending: false }).limit(200);
  if (A.reqFilter !== 'all') q = q.eq('status', A.reqFilter);
  const { data, error } = await q;
  if (error) return main(`<h1>Beta requests</h1><div class="card err">${esc(error.message)}${/beta_requests/.test(error.message) ? ' Run supabase/nexus-v2.0.sql first.' : ''}</div>`);
  if (A.reqFilter === 'pending') A.pending = data.length;
  main(`<h1>Beta requests</h1><p>People who asked to test new features (from Settings → Account in the app). Approving turns beta on for their account right away.</p>
    <div class="tabsub" id="rf">${['pending', 'approved', 'declined', 'all'].map(f => `<button data-f="${f}" class="${A.reqFilter === f ? 'on' : ''}">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}</div>
    ${data.map(r => `<div class="card req"><div class="who"><b>${esc(r.username || '(no username)')}</b> <span class="pill p-${esc(r.status)}">${esc(r.status.toUpperCase())}</span>
      <div class="muted">${esc(r.email)} · ${when(r.created_at)} · ${esc(r.source)} ${esc(r.app_version)}</div>
      ${r.why ? `<q><b class="muted">Why:</b> ${esc(r.why)}</q>` : ''}${r.uses ? `<q><b class="muted">Uses Nexus for:</b> ${esc(r.uses)}</q>` : ''}
      ${r.status !== 'pending' ? `<div class="muted" style="margin-top:6px">${r.status === 'approved' ? 'Approved' : 'Declined'} ${when(r.reviewed_at)}${r.note ? ' · “' + esc(r.note) + '”' : ''}</div>` : ''}</div>
      <div class="acts">${r.status === 'pending' ? `<input class="field" placeholder="Note (optional)" data-note="${esc(r.id)}"><button class="btn primary" data-ok="${esc(r.id)}">✓ Approve</button><button class="btn danger" data-no="${esc(r.id)}">Decline</button>`
        : r.status === 'declined' ? `<button class="btn" data-ok="${esc(r.id)}">Approve after all</button>` : ''}</div></div>`).join('') || `<div class="empty">No ${A.reqFilter === 'all' ? '' : A.reqFilter + ' '}requests.</div>`}`);
  $('main').onclick = async e => {
    const f = e.target.closest('[data-f]'); if (f) { A.reqFilter = f.dataset.f; return requests(); }
    const b = e.target.closest('[data-ok],[data-no]'); if (!b) return;
    const id = b.dataset.ok || b.dataset.no, approve = !!b.dataset.ok;
    b.disabled = true;
    try { await rpc('admin_review_beta_request', { request_id: id, approve, review_note: document.querySelector(`[data-note="${id}"]`)?.value || '' }); toast(approve ? '✓ Approved: beta is on for them' : 'Declined'); A.pending = Math.max(0, A.pending - 1); shell(); }
    catch (err) { b.disabled = false; toast(err.message, true); }
  };
}

// ---------- users
async function users(email = A.lastEmail || '') {
  main(`<h1>Users</h1><p>Look someone up by email to see their account and change beta, comp, moderation or admin role.</p>
    <form class="row" id="lf"><input class="field" id="le" type="email" placeholder="name@example.com" value="${esc(email)}" style="flex:1;min-width:220px"><button class="btn primary">Look up</button></form><div id="ud" style="margin-top:14px"></div>`);
  $('lf').onsubmit = e => { e.preventDefault(); lookup($('le').value.trim()); };
  if (email) lookup(email);
}
async function lookup(email) {
  if (!email) return;
  A.lastEmail = email;
  $('ud').innerHTML = '<p class="muted">Looking up…</p>';
  let u; try { u = await rpc('admin_lookup_user', { target_email: email }); } catch (e) { $('ud').innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  const p = u.profile || {}, m = u.moderation, high = A.level === 'high-admin';
  $('ud').innerHTML = `<div class="card"><h3>${esc(p.username || '(no username)')} ${u.admin_level ? `<span class="pill p-approved">${esc(u.admin_level.toUpperCase())}</span>` : ''}${p.is_beta_tester ? ' <span class="pill" style="color:var(--cyan)">BETA</span>' : ''}${p.is_comped ? ' <span class="pill" style="color:var(--gold)">COMPED</span>' : ''}</h3>
      <div class="kv"><span>Email</span><span>${esc(u.email)}</span><span>Joined</span><span>${when(p.created_at)}</span><span>Nickname</span><span>${esc(p.nickname || '—')}</span>
        <span>Status</span><span>${m && m.status !== 'active' ? `<b class="err">${esc(m.status)}</b>${m.reason ? ' · ' + esc(m.reason) : ''}${m.suspended_until ? ' · until ' + when(m.suspended_until) : ''}` : 'Active'}</span>
        <span>Chat usage</span><span>${(u.chat_usage || []).map(c => `${esc(c.assistant_name)}: ${c.count} <button class="btn" style="padding:0 8px;font-size:12px" data-reset="${esc(c.assistant_name)}">reset</button>`).join(' · ') || '—'}</span>
        <span>Orders</span><span>${(u.redemptions || []).map(r => esc(r.order_id) + (r.tier ? ' (' + esc(r.tier) + ')' : '')).join(', ') || '—'}</span></div></div>
    <div class="card"><h3>Perks</h3><div class="row"><button class="btn ${p.is_beta_tester ? 'danger' : 'primary'}" data-beta="${p.is_beta_tester ? 0 : 1}">${p.is_beta_tester ? 'Remove beta' : 'Make beta tester'}</button>
      <button class="btn" data-comp="${p.is_comped ? 0 : 1}">${p.is_comped ? 'Remove comp' : 'Comp (unlimited free key)'}</button></div></div>
    <div class="card"><h3>Moderation</h3><div class="row"><select class="field" id="ms"><option value="active">Active</option><option value="suspended">Suspend</option><option value="banned">Ban</option></select>
      <input class="field" id="mh" type="number" min="1" placeholder="Hours (suspend)" style="width:140px"><input class="field" id="mr" placeholder="Reason" style="flex:1;min-width:160px"><button class="btn" id="mgo">Apply</button></div></div>
    ${high ? `<div class="card"><h3>Admin role <span class="muted">(high-admins only)</span></h3><div class="row"><select class="field" id="rl"><option value="mod">Mod</option><option value="admin">Admin</option><option value="high-admin">High-admin</option></select>
      <button class="btn" id="rgo">Grant</button>${u.admin_level ? '<button class="btn danger" id="rrv">Revoke role</button>' : ''}</div></div>` : ''}`;
  $('ud').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.beta) await rpc('admin_set_beta_tester', { target_email: email, enabled: b.dataset.beta === '1' });
      else if (b.dataset.comp) await rpc('admin_set_comp', { target_email: email, enabled: b.dataset.comp === '1' });
      else if (b.dataset.reset) { if (!confirm(`Reset ${b.dataset.reset} chat count?`)) return; await rpc('admin_reset_chat_usage', { target_email: email, target_assistant: b.dataset.reset }); }
      else if (b.id === 'mgo') await rpc('admin_set_moderation', { target_email: email, new_status: $('ms').value, reason_text: $('mr').value || null, suspend_hours: $('mh').value ? +$('mh').value : null });
      else if (b.id === 'rgo') { if (!confirm(`Make ${email} a ${$('rl').value}?`)) return; await rpc('admin_grant_role', { target_email: email, new_level: $('rl').value }); }
      else if (b.id === 'rrv') { if (!confirm(`Remove ${email}'s admin role?`)) return; await rpc('admin_revoke_role', { target_email: email }); }
      else return;
      toast('✓ Saved'); lookup(email);
    } catch (err) { toast(err.message, true); }
  };
}

// ---------- feature flags
async function flags() {
  const { data, error } = await sb.from('feature_flags').select('*').order('key');
  if (error) return main(`<h1>Feature flags</h1><div class="card err">${esc(error.message)}</div>`);
  const ST = [['off', 'Off'], ['admin', 'Admins'], ['beta', 'Beta testers'], ['all', 'Everyone']];
  main(`<h1>Feature flags</h1><p>Who gets each feature in the app. Changes reach apps on their next sync (a few minutes), no update needed.</p>
    <div class="card"><table><tr><th>Feature</th><th>Who gets it</th><th>Min version</th><th></th></tr>${data.map(f => `<tr><td><b>${esc(f.title || f.key)}</b><div class="muted">${esc(f.key)}${f.description ? ' · ' + esc(f.description) : ''}</div></td>
      <td><select class="field" data-stage="${esc(f.key)}">${ST.map(([v, l]) => `<option value="${v}" ${f.stage === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
      <td><input class="field" data-minv="${esc(f.key)}" value="${esc(f.min_version || '')}" placeholder="any" style="width:90px"></td><td class="muted">${when(f.updated_at)}</td></tr>`).join('')}</table></div>
    <div class="card"><h3>New flag</h3><div class="row"><input class="field" id="nk" placeholder="key_like_this"><input class="field" id="nt" placeholder="Title"><input class="field" id="nd" placeholder="Description" style="flex:1"><select class="field" id="ns">${ST.map(([v, l]) => `<option value="${v}" ${v === 'admin' ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn primary" id="nadd">Add</button></div></div>`);
  $('main').onchange = async e => {
    const t = e.target, key = t.dataset.stage || t.dataset.minv; if (!key) return;
    const patch = t.dataset.stage ? { stage: t.value } : { min_version: t.value.trim() || null };
    const { error } = await sb.from('feature_flags').update({ ...patch, updated_at: new Date().toISOString() }).eq('key', key);
    toast(error ? error.message : '✓ Saved', !!error);
  };
  $('main').onclick = async e => {
    if (e.target.id !== 'nadd') return;
    const key = $('nk').value.trim(); if (!/^[a-z0-9_]{2,48}$/.test(key)) return toast('Keys are 2–48 lowercase letters, numbers and _', true);
    const { error } = await sb.from('feature_flags').insert({ key, title: $('nt').value.trim() || key, description: $('nd').value.trim(), stage: $('ns').value });
    if (error) return toast(error.message, true); toast('✓ Added'); flags();
  };
}

// ---------- announcements
async function announce() {
  const { data, error } = await sb.from('announcements').select('*').order('created_at', { ascending: false }).limit(50);
  if (error) return main(`<h1>Announcements</h1><div class="card err">${esc(error.message)}</div>`);
  main(`<h1>Announcements</h1><p>Active announcements show as a banner in the app and on web Nexus.</p>
    <div class="card"><h3>New announcement</h3><textarea class="field" id="am" rows="2" placeholder="Nexus 2.0 is out! Update from the app menu."></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="aadd">Post</button></div></div>
    ${data.map(a => `<div class="card"><div class="row"><span class="pill ${a.active ? 'p-approved' : 'p-declined'}">${a.active ? 'LIVE' : 'OFF'}</span><span class="muted">${when(a.created_at)}</span><span style="flex:1"></span>
      <button class="btn" data-tog="${a.id}" data-on="${a.active ? 0 : 1}">${a.active ? 'Turn off' : 'Turn on'}</button><button class="btn danger" data-del="${a.id}">Delete</button></div><div style="margin-top:6px">${esc(a.message)}</div></div>`).join('') || '<div class="empty">No announcements yet.</div>'}`);
  $('main').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; let error;
    if (b.id === 'aadd') { const m = $('am').value.trim(); if (!m) return; ({ error } = await sb.from('announcements').insert({ message: m, active: true, created_by: A.user.id })); }
    else if (b.dataset.tog) ({ error } = await sb.from('announcements').update({ active: b.dataset.on === '1' }).eq('id', b.dataset.tog));
    else if (b.dataset.del) { if (!confirm('Delete this announcement?')) return; ({ error } = await sb.from('announcements').delete().eq('id', b.dataset.del)); }
    else return;
    toast(error ? error.message : '✓ Saved', !!error); if (!error) announce();
  };
}

// ---------- maintenance
async function maint() {
  const { data, error } = await sb.from('maintenance_config').select('*').order('scope');
  if (error) return main(`<h1>Maintenance</h1><div class="card err">${esc(error.message)}</div>`);
  const on = m => m.enabled === true || m.enabled === 'true' || m.enabled?.enabled === true;
  main(`<h1>Maintenance</h1><p>Take things offline with a message. Scope <b>global</b> = everything, <b>desktop</b> = the Mac app, an agent id (like <b>flash</b>) = that agent, or a feature name (like <b>seek</b>).</p>
    ${data.map(m => `<div class="card"><div class="row"><b style="font-family:var(--mono)">${esc(m.scope)}</b><span class="pill ${on(m) ? 'p-declined' : 'p-approved'}">${on(m) ? 'DOWN' : 'UP'}</span><span class="muted">${when(m.updated_at)}</span><span style="flex:1"></span>
      <button class="btn ${on(m) ? 'primary' : 'danger'}" data-mt="${esc(m.scope)}" data-on="${on(m) ? 0 : 1}">${on(m) ? 'Bring back up' : 'Take down'}</button></div>
      <div class="row" style="margin-top:8px"><input class="field" style="flex:1" data-msg="${esc(m.scope)}" value="${esc(m.message || '')}" placeholder="Message people see"></div></div>`).join('') || '<div class="empty">Nothing configured.</div>'}
    <div class="card"><h3>New scope</h3><div class="row"><input class="field" id="msc" placeholder="global · desktop · flash · seek"><input class="field" id="mms" placeholder="Message" style="flex:1"><button class="btn danger" id="madd">Take down</button></div></div>`);
  $('main').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; let error;
    if (b.dataset.mt) { if (b.dataset.on === '1' && !confirm(`Take "${b.dataset.mt}" down for everyone?`)) return; ({ error } = await sb.from('maintenance_config').update({ enabled: b.dataset.on === '1', updated_at: new Date().toISOString() }).eq('scope', b.dataset.mt)); }
    else if (b.id === 'madd') { const scope = $('msc').value.trim().toLowerCase(); if (!scope) return; if (!confirm(`Take "${scope}" down for everyone?`)) return; ({ error } = await sb.from('maintenance_config').upsert({ scope, enabled: true, message: $('mms').value.trim(), updated_at: new Date().toISOString() })); }
    else return;
    toast(error ? error.message : '✓ Saved', !!error); if (!error) maint();
  };
  $('main').onchange = async e => { const s = e.target.dataset.msg; if (!s) return; const { error } = await sb.from('maintenance_config').update({ message: e.target.value, updated_at: new Date().toISOString() }).eq('scope', s); toast(error ? error.message : '✓ Message saved', !!error); };
}

// ---------- audit log
async function audit() {
  const r = await rpc('admin_get_audit_log', { row_limit: 100 });
  main(`<h1>Audit log</h1><p>Every admin action: roles, perks, moderation and beta decisions.</p><div class="card"><table><tr><th>When</th><th>Action</th><th>Account</th><th>By</th></tr>${(r.entries || []).map(x => `<tr><td class="muted">${when(x.created_at)}</td><td>${esc(String(x.action).replace(/_/g, ' '))}</td><td>${esc(x.target_email || '—')}</td><td class="muted">${esc(x.performed_by_email || 'system')}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nothing yet.</td></tr>'}</table></div>`);
}


// ---------- admin chat (v2.1): one group chat for every admin + private DMs. Realtime when the table is in the
// supabase_realtime publication (nexus-v2.1.sql does that), polling every 8 s otherwise.
const C = { admins: [], me: '', room: 'all', open: false, msgs: {}, last: {}, seen: JSON.parse(localStorage.getItem('nx-admin-seen') || '{}'), ch: null, live: false, poll: 0 };
const COLORS = ['#3dffa0', '#5ce1ff', '#ffd36b', '#ff8fd0', '#b69cff', '#ff9f6b'];
const colorOf = id => COLORS[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const nameOf = a => a ? (a.nickname || a.username || String(a.email || '').split('@')[0] || 'Admin') : 'Admin';
const dmRoom = other => 'dm:' + [C.me, other].sort().join(':');
const roomName = r => r === 'all' ? 'All admins' : nameOf(C.admins.find(a => r.includes(a.id) && a.id !== C.me));
function badge() { const n = document.querySelector('[data-tab="chat"]'); if (n) n.innerHTML = '💬 Admin chat' + (A.unread ? `<span class="n">${A.unread}</span>` : ''); }
function saveSeen() { try { localStorage.setItem('nx-admin-seen', JSON.stringify(C.seen)); } catch {} }
function unreadCount() { return Object.keys(C.last).filter(r => C.last[r] && C.last[r].sender !== C.me && C.last[r].id > (C.seen[r] || 0)).length; }
function chatInit() { return C.init || (C.init = chatInit_().catch(e => { C.init = null; throw e; })); }
async function chatInit_() {
  const r = await rpc('admin_list_admins'); C.me = r.me; C.admins = r.admins || [];
  const { data } = await sb.from('admin_messages').select('id,room,sender,created_at').order('id', { ascending: false }).limit(200);
  for (const m of data || []) if (!C.last[m.room]) C.last[m.room] = m;
  A.unread = unreadCount();
  C.ch = sb.channel('admin-chat').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'admin_messages' }, p => got(p.new))
    .subscribe(st => { C.live = st === 'SUBSCRIBED'; const l = document.querySelector('.live'); if (l) { l.className = 'live' + (C.live ? '' : ' off'); l.textContent = C.live ? '● LIVE' : '○ polling'; } });
  C.poll = setInterval(() => { if (!C.live) pollChat(); }, 8000);
}
async function pollChat() {
  const top = Math.max(0, ...Object.values(C.last).map(m => m.id));
  const { data } = await sb.from('admin_messages').select('*').gt('id', top).order('id').limit(100);
  (data || []).forEach(got);
}
function got(m) {
  if (!m || (C.msgs[m.room] || []).some(x => x.id === m.id) || (C.last[m.room] && C.last[m.room].id === m.id && !C.msgs[m.room])) return;
  if (!C.last[m.room] || C.last[m.room].id < m.id) C.last[m.room] = m;
  if (C.msgs[m.room] && !C.msgs[m.room].some(x => x.id === m.id)) C.msgs[m.room].push(m);
  const viewing = A.tab === 'chat' && C.room === m.room && document.visibilityState === 'visible' && (C.open || innerWidth > 760);
  if (viewing) { C.seen[m.room] = m.id; saveSeen(); paintMsgs(); }
  else if (m.sender !== C.me) toast(`💬 ${m.sender_name || 'Admin'} · ${roomName(m.room)}: ${String(m.body).slice(0, 60)}`);
  A.unread = unreadCount(); badge();
  if (A.tab === 'chat') paintRooms();
}
async function chat() {
  await chatInit();
  main(`<h1>Admin chat <span class="live ${C.live ? '' : 'off'}">${C.live ? '● LIVE' : '○ polling'}</span></h1><p>A group chat with every admin, plus private messages. Only admins can read these.</p>
    <div class="chat ${C.open ? 'open' : ''}" id="chat"><div class="rooms" id="rooms"></div>
    <div class="thread"><div class="top"><button class="btn back" id="back">‹</button><b id="rn"></b><span class="muted" id="rs"></span></div><div class="msgs" id="msgs"></div>
    <form class="compose" id="cf"><textarea class="field" id="ct" placeholder="Message…" maxlength="4000"></textarea><button class="btn primary">Send</button></form></div></div>`);
  paintRooms(); await openRoom(C.room, false);
  $('rooms').onclick = e => { const b = e.target.closest('[data-room]'); if (b) openRoom(b.dataset.room, true); };
  $('back').onclick = () => { C.open = false; $('chat').classList.remove('open'); paintRooms(); };
  $('cf').onsubmit = e => { e.preventDefault(); send(); };
  $('ct').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && innerWidth > 760) { e.preventDefault(); send(); } };
  $('ct').oninput = e => { e.target.style.height = '40px'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; };
}
function paintRooms() {
  const el = $('rooms'); if (!el) return;
  const item = (room, label, sub, color, letter) => { const u = C.last[room] && C.last[room].sender !== C.me && C.last[room].id > (C.seen[room] || 0);
    return `<button data-room="${esc(room)}" class="${C.room === room ? 'on' : ''}"><span class="av" style="background:${color}">${esc(letter)}</span><span class="nm">${esc(label)}<small>${esc(sub)}</small></span>${u ? '<span class="dot"></span>' : ''}</button>`; };
  const others = C.admins.filter(a => a.id !== C.me);
  el.innerHTML = item('all', 'All admins', `${C.admins.length} admin${C.admins.length === 1 ? '' : 's'}`, 'var(--accent)', '#') + '<h4>DIRECT MESSAGES</h4>' +
    (others.map(a => item(dmRoom(a.id), nameOf(a), `${a.level} · ${a.email || ''}`, colorOf(a.id), nameOf(a)[0].toUpperCase())).join('') || '<p class="muted" style="padding:0 10px">No other admins yet.</p>');
}
async function openRoom(room, user) {
  C.room = room; if (user) { C.open = true; $('chat').classList.add('open'); }
  $('rn').textContent = roomName(room);
  $('rs').textContent = room === 'all' ? '' : (C.admins.find(a => room.includes(a.id) && a.id !== C.me)?.level || '');
  paintRooms();
  if (!C.msgs[room]) {
    $('msgs').innerHTML = '<div class="empty">Loading…</div>';
    const { data, error } = await sb.from('admin_messages').select('*').eq('room', room).order('id', { ascending: false }).limit(150);
    if (error) { $('msgs').innerHTML = `<div class="empty err">${esc(error.message.includes('admin_messages') ? 'Run supabase/nexus-v2.1.sql first to turn on admin chat.' : error.message)}</div>`; return; }
    C.msgs[room] = (data || []).reverse();
  }
  paintMsgs();
  if (innerWidth > 760 || C.open) $('ct').focus();
}
function paintMsgs() {
  const el = $('msgs'); if (!el) return;
  const list = C.msgs[C.room] || [];
  if (list.length) { C.seen[C.room] = Math.max(C.seen[C.room] || 0, list[list.length - 1].id); saveSeen(); A.unread = unreadCount(); badge(); }
  let lastDay = '', lastBy = '', lastT = 0;
  el.innerHTML = list.map(m => {
    const d = new Date(m.created_at), day = d.toDateString(), t = +d;
    const cont = m.sender === lastBy && day === lastDay && t - lastT < 5 * 60e3;
    const head = day !== lastDay ? `<div class="day">${d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}</div>` : '';
    lastDay = day; lastBy = m.sender; lastT = t;
    const mine = m.sender === C.me;
    return `${head}<div class="m ${mine ? 'me' : ''} ${cont ? 'cont' : ''}"><div class="by">${mine ? '' : `<b style="color:${colorOf(m.sender)}">${esc(m.sender_name || 'Admin')}</b> · `}${d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</div><span class="bub">${esc(m.body)}</span></div>`;
  }).join('') || `<div class="empty">${C.room === 'all' ? 'Say hi to the team 👋' : 'No messages yet. Start the conversation.'}</div>`;
  el.scrollTop = el.scrollHeight;
}
async function send() {
  const t = $('ct'), body = t.value.trim(); if (!body) return;
  t.value = ''; t.style.height = '40px';
  const me = C.admins.find(a => a.id === C.me);
  const { data, error } = await sb.from('admin_messages').insert({ room: C.room, body, sender_name: nameOf(me || { email: A.user.email }).slice(0, 60) }).select().single();
  if (error) { t.value = body; return toast(error.message, true); }
  got(data);
}

// ---------- sign in + gate
function signIn(msg = '') {
  $('who').textContent = '';
  $('app').innerHTML = `<div class="login"><form class="card" id="f"><h3>Admin sign in</h3><p class="muted" style="margin:0">Use your Nexus account. This portal only works for admins.</p>
    <input class="field" id="em" type="email" placeholder="Email" autocomplete="username" required><input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary">Sign in</button><div class="err" id="er">${esc(msg)}</div></form></div>`;
  $('f').onsubmit = async e => { e.preventDefault(); const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value }); if (error) $('er').textContent = error.message; else start(); };
}
async function start() {
  const { data } = await sb.auth.getSession();
  A.user = data.session?.user || null;
  if (!A.user) return signIn();
  const { data: level } = await sb.rpc('get_my_admin_level');
  if (!level) { await sb.auth.signOut(); return signIn("That account isn't an admin."); }
  A.level = level;
  $('who').innerHTML = `${esc(A.user.email)}<br><span class="pill p-approved">${esc(level.toUpperCase())}</span>`;
  try { const o = await rpc('admin_overview'); A.pending = o.pending_requests; } catch {}
  shell();
  chatInit().then(() => { if (A.unread) shell(); }).catch(() => {});
}
start();
</script>
