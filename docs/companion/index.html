<!-- N28C — Nexus '28 on your phone. Everything goes through your own Nexus account:
     • your Mac shares agents, chats, flashcards, stats and its theme in public.companion_sync (only you can read it)
     • questions and actions go to your Mac through public.relay_messages; your Mac answers while Nexus is open
     • photos you send go through public.companion_files and are deleted once your Mac picks them up
     • Shared Spaces (public.shared_space_*) are visible only to the people in them. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="orb.js"></script>
<script src="widgets.js"></script>
<style>
  :root { --accent: #3dffa0; --rgb: 61,255,160; --accent-rgb: var(--rgb); --bg: #04100b; --panel: #0b1f17; --panel2: #0f2a20; --text: #e2fff1; --muted: #7aa894; --on-accent: #032313; --danger: #ff6b7d; --gold: #ffd36b;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); overscroll-behavior: none; }
  html, body, header, nav.tabs, .msg, .item, .panel, .card { transition: background-color .4s, border-color .4s, color .4s; }
  body { display: flex; flex-direction: column; background: radial-gradient(ellipse at 15% -10%, rgba(var(--rgb), .16), transparent 55%), var(--bg); }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea, select { font: 16px var(--sans); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 8px) 14px 8px; border-bottom: 1px solid rgba(var(--rgb), .14); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); }
  #hOrb { width: 34px; height: 34px; flex: none; margin: -2px -2px -2px -4px; }
  header .t { min-width: 0; } header .t b { display: block; font: 700 13px var(--mono); letter-spacing: .26em; } header .t small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mac { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex: none; }
  .mac i { width: 8px; height: 8px; border-radius: 50%; background: #555; } .mac.on i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .hbtn { border: 1px solid rgba(var(--rgb), .25); background: none; border-radius: 10px; padding: 5px 10px; font-size: 13px; color: var(--accent); flex: none; }
  .hbtn.on { background: var(--accent); color: var(--on-accent); }
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view { display: none; padding: 12px 14px 20px; } .view.on { display: block; }
  nav.tabs { display: flex; border-top: 1px solid rgba(var(--rgb), .14); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 8px 0 7px; color: var(--muted); font-size: 11px; display: grid; justify-items: center; gap: 2px; position: relative; }
  nav.tabs button svg { width: 22px; height: 22px; } nav.tabs button.on { color: var(--accent); }
  nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--gold); color: #1b1300; border-radius: 9px; font: 700 10px var(--sans); padding: 0 5px; min-width: 16px; }
  /* chat */
  .thread-bar { display: flex; align-items: center; gap: 7px; margin: -2px 0 10px; font-size: 13px; color: var(--muted); }
  .thread-bar b { color: var(--text); font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 10px 13px; border-radius: 16px; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.you { align-self: flex-end; background: rgba(var(--rgb), .16); border: 1px solid rgba(var(--rgb), .35); border-bottom-right-radius: 5px; white-space: pre-wrap; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid rgba(var(--rgb), .14); border-bottom-left-radius: 5px; width: 92%; }
  .msg .who { display: flex; align-items: center; gap: 6px; font: 600 10px var(--mono); letter-spacing: .14em; color: var(--muted); margin-bottom: 4px; }
  .msg .who i { width: 7px; height: 7px; border-radius: 50%; }
  .msg.err { border-color: rgba(255, 107, 125, .5); color: #ffd0d6; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; } .msg h4 { margin: 8px 0 4px; font-size: 15px; }
  .msg code { font: 13px var(--mono); background: rgba(var(--rgb), .1); padding: 1px 4px; border-radius: 4px; }
  .msg pre { background: rgba(0,0,0,.35); padding: 8px 10px; border-radius: 8px; overflow-x: auto; font: 12.5px var(--mono); white-space: pre; margin: 6px 0; }
  .msg pre code { background: none; padding: 0; }
  .msg a { color: var(--accent); }
  .msg .att { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid rgba(var(--rgb), .25); border-radius: 8px; padding: 1px 7px; margin-bottom: 4px; }
  .msg .tools { display: flex; gap: 14px; margin-top: 6px; } .msg .tools button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0; } .msg .tools button.on { color: var(--accent); }
  .msg .feats { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; } .msg .feats span { font: 10px var(--mono); color: var(--accent); border: 1px solid rgba(var(--rgb), .3); border-radius: 6px; padding: 0 5px; }
  .msg .widget { font-size: 14px; } .msg .fc-grid { grid-template-columns: 1fr 1fr; }
  .wait { align-self: flex-start; color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .dots i { display: inline-block; width: 5px; height: 5px; margin: 0 1px; border-radius: 50%; background: var(--accent); animation: b 1.2s infinite; } .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .empty { text-align: center; color: var(--muted); padding: 34px 16px; } .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .suggest { display: grid; gap: 8px; margin-top: 16px; } .suggest button { border: 1px solid rgba(var(--rgb), .2); background: var(--panel); border-radius: 12px; padding: 10px 12px; text-align: left; font-size: 14px; }
  footer.composer { padding: 6px 8px 7px; border-top: 1px solid rgba(var(--rgb), .14); background: rgba(0,0,0,.3); display: none; }
  footer.composer.on { display: block; }
  .crow { display: flex; gap: 6px; align-items: flex-end; }
  .agentbtn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid rgba(var(--rgb), .3); background: none; border-radius: 50%; padding: 0; }
  .agentbtn i { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .pill { flex: 1; min-width: 0; display: flex; align-items: flex-end; border: 1px solid rgba(var(--rgb), .3); background: rgba(0,0,0,.3); border-radius: 18px; padding: 0 4px 0 0; }
  .pill:focus-within { border-color: var(--accent); }
  .pill textarea { flex: 1; min-width: 0; border: 0 !important; background: none; padding: 7px 4px 7px 12px; max-height: 140px; border-radius: 18px; }
  .pbtn { flex: none; width: 30px; height: 34px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; font: 600 15px var(--sans); padding: 0; }
  .pbtn svg { width: 18px; height: 18px; } .pbtn.on { color: var(--accent); } .pbtn.live { color: var(--danger); animation: b 1s infinite; }
  textarea, .field { width: 100%; resize: none; border: 1px solid rgba(var(--rgb), .3); background: rgba(0,0,0,.3); border-radius: 14px; padding: 9px 12px; outline: none; }
  .crow textarea { flex: 1; min-width: 0; width: auto; border-radius: 16px; max-height: 140px; }
  textarea:focus, .field:focus { border-color: var(--accent); }
  .ibtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(var(--rgb), .3); background: none; display: grid; place-items: center; }
  .ibtn svg { width: 19px; height: 19px; } .ibtn.live { border-color: var(--danger); color: var(--danger); animation: b 1s infinite; }
  .send { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; } .send:disabled { opacity: .35; } .send svg { width: 18px; height: 18px; }
  .featrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 6px; } .featrow::-webkit-scrollbar { display: none; }
  .featrow button { flex: none; border: 1px solid rgba(var(--rgb), .2); background: none; color: var(--muted); border-radius: 12px; padding: 3px 10px; font: 12px var(--mono); }
  .featrow button.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .photo { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 13px; color: var(--muted); } .photo img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(var(--rgb), .3); } .photo button { border: 0; background: none; color: var(--muted); font-size: 18px; }
  .talk { display: flex; align-items: center; gap: 10px; padding: 4px 2px; } .talk canvas { width: 56px; height: 56px; flex: none; } .talk div { flex: 1; min-width: 0; } .talk b { display: block; } .talk small { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* sheet */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; z-index: 10; }
  .sheet.on { display: flex; }
  .sheet .box { width: 100%; max-height: 84%; overflow-y: auto; background: var(--panel); border-radius: 20px 20px 0 0; padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(var(--rgb), .25); }
  .sheet h3 { margin: 4px 4px 10px; font-size: 13px; letter-spacing: .18em; color: var(--muted); font-family: var(--mono); }
  .sheet label { display: block; font-size: 13px; color: var(--muted); margin: 10px 4px 4px; }
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 11px 8px; border-radius: 10px; text-align: left; }
  .opt.on { background: rgba(var(--rgb), .1); } .opt i { width: 10px; height: 10px; border-radius: 50%; flex: none; } .opt b { font-weight: 600; } .opt small { color: var(--muted); margin-left: auto; font-size: 12px; text-align: right; }
  .opt.danger { color: var(--danger); }
  /* lists */
  .search { width: 100%; border: 1px solid rgba(var(--rgb), .25); background: rgba(0,0,0,.3); border-radius: 12px; padding: 10px 12px; outline: none; margin-bottom: 8px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 6px; } .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid rgba(var(--rgb), .2); background: none; color: var(--muted); border-radius: 12px; padding: 4px 11px; font-size: 13px; display: flex; align-items: center; gap: 5px; }
  .chips button.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); } .chips i { width: 7px; height: 7px; border-radius: 50%; } .chips button.on i { box-shadow: 0 0 0 1.5px var(--on-accent); }
  select.field { color-scheme: dark; }
  .group { font: 600 11px var(--mono); letter-spacing: .2em; color: var(--muted); margin: 14px 4px 6px; display: flex; align-items: center; gap: 8px; } .group button { margin-left: auto; letter-spacing: 0; font-family: var(--sans); }
  .item { display: flex; gap: 10px; width: 100%; text-align: left; background: var(--panel); border-radius: 14px; padding: 11px 12px; margin-bottom: 6px; border: 1px solid rgba(var(--rgb), .1); align-items: flex-start; }
  .item .dots2 { display: flex; gap: 3px; padding-top: 7px; flex: none; width: 22px; } .item .dots2 i { width: 6px; height: 6px; border-radius: 50%; }
  .item .main { flex: 1; min-width: 0; } .item b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .r { flex: none; text-align: right; color: var(--muted); font-size: 12px; } .tag { display: inline-block; font: 10px var(--mono); padding: 0 6px; border-radius: 6px; border: 1px solid currentColor; margin-top: 3px; }
  .more { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 2px 0 6px; line-height: 1; align-self: center; }
  /* study */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stats div { background: var(--panel); border: 1px solid rgba(var(--rgb), .12); border-radius: 14px; padding: 10px 6px; text-align: center; } .stats b { display: block; font-size: 22px; color: var(--accent); } .stats span { font-size: 11px; color: var(--muted); }
  .big { width: 100%; border: 0; border-radius: 14px; padding: 13px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; margin-bottom: 10px; } .big:disabled { opacity: .35; }
  .big.ghost { background: none; color: var(--accent); border: 1px solid rgba(var(--rgb), .4); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .row2 .big { margin-bottom: 8px; }
  .deck .bar { height: 3px; background: rgba(var(--rgb), .12); border-radius: 2px; margin-top: 6px; overflow: hidden; } .deck .bar span { display: block; height: 100%; background: var(--accent); }
  .due { color: var(--gold) !important; font-weight: 600; }
  .card { min-height: 240px; display: grid; place-content: center; gap: 16px; text-align: center; padding: 24px 18px; border-radius: 20px; background: radial-gradient(ellipse at 50% 0%, rgba(var(--rgb), .14), transparent 70%), var(--panel); border: 1px solid rgba(var(--rgb), .3); margin: 10px 0 12px; }
  .card .f { font-size: 22px; font-weight: 600; line-height: 1.35; } .card .bk { font-size: 18px; color: var(--accent); border-top: 1px dashed rgba(var(--rgb), .3); padding-top: 14px; } .card small { color: var(--muted); font-size: 12px; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; } .grades button { border: 1px solid rgba(var(--rgb), .25); background: var(--panel); border-radius: 12px; padding: 10px 2px; display: grid; gap: 1px; font-weight: 600; }
  .grades small { color: var(--muted); font-weight: 400; font-size: 11px; } .g0 { color: #ff8a98; border-color: rgba(255, 107, 125, .5) !important; } .g1 { color: #ffb547; } .g2 { color: var(--accent); } .g3 { color: #5ce1ff; }
  .grades.two { grid-template-columns: 1fr 1fr; }
  .prog { height: 4px; border-radius: 3px; background: rgba(var(--rgb), .12); overflow: hidden; } .prog span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .center { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0; }
  .qz button { display: block; width: 100%; text-align: left; border: 1px solid rgba(var(--rgb), .2); background: var(--panel); border-radius: 12px; padding: 11px 12px; margin-bottom: 7px; font-size: 15px; }
  .qz button.right { border-color: var(--accent); background: rgba(var(--rgb), .15); } .qz button.wrong { border-color: var(--danger); background: rgba(255, 107, 125, .12); }
  .cardrow { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--panel); margin-bottom: 6px; border: 1px solid rgba(var(--rgb), .08); } .cardrow b { display: block; } .cardrow span { color: var(--muted); font-size: 14px; } .cardrow small { float: right; font-size: 11px; color: var(--muted); }
  /* spaces */
  .sp-feed { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px; }
  .post { background: var(--panel); border: 1px solid rgba(var(--rgb), .1); border-radius: 14px; padding: 9px 12px; } .post.me { border-color: rgba(var(--rgb), .35); background: rgba(var(--rgb), .1); }
  .post .by { font: 600 11px var(--mono); letter-spacing: .08em; color: var(--muted); display: flex; gap: 6px; align-items: center; } .post .by span { margin-left: auto; font-weight: 400; letter-spacing: 0; font-family: var(--sans); }
  .post.join { background: none; border: 0; text-align: center; color: var(--muted); font-size: 12px; padding: 2px; }
  .post .deckshare { display: flex; align-items: center; gap: 10px; margin-top: 4px; } .post .deckshare div { flex: 1; } .post .deckshare button { border: 1px solid rgba(var(--rgb), .35); background: none; color: var(--accent); border-radius: 10px; padding: 5px 10px; font-size: 13px; }
  .members { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } .members::-webkit-scrollbar { display: none; }
  .members div { flex: none; background: var(--panel); border: 1px solid rgba(var(--rgb), .1); border-radius: 12px; padding: 6px 10px; font-size: 13px; } .members small { display: block; color: var(--muted); font-size: 11px; }
  .code { font: 700 20px var(--mono); letter-spacing: .3em; color: var(--accent); }
  /* panels */
  .panel { background: var(--panel); border: 1px solid rgba(var(--rgb), .12); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .panel h4 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: .2em; color: var(--muted); display: flex; align-items: center; gap: 8px; } .panel h4 span { margin-left: auto; letter-spacing: 0; font-family: var(--sans); font-weight: 400; color: var(--accent); }
  .panel .big { margin: 8px 0 0; padding: 11px; font-size: 15px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; } .acts button { border: 1px solid rgba(var(--rgb), .3); background: rgba(var(--rgb), .06); border-radius: 12px; padding: 10px 6px; font-size: 14px; }
  .acts button:disabled { opacity: .35; }
  .challenge b { font-size: 16px; } .challenge .prog { margin: 8px 0 4px; }
  .ach { display: flex; flex-wrap: wrap; gap: 6px; } .ach span { font-size: 13px; padding: 4px 9px; border-radius: 10px; background: rgba(var(--rgb), .08); }

  .rt div { flex: 1; min-width: 0; } .rt b { display: block; font-weight: 600; } .rt small { color: var(--muted); font-size: 12px; }
  .rt button { border: 1px solid rgba(var(--rgb), .35); background: none; color: var(--accent); border-radius: 10px; padding: 5px 12px; font-size: 13px; }
  .tgl { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(var(--rgb), .08); } .tgl:first-of-type { border-top: 0; } .tgl span { flex: 1; } .tgl small { display: block; color: var(--muted); font-size: 12px; }

  .clipitem { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid rgba(var(--rgb), .08); background: none; padding: 7px 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tpl { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 6px 0; } .tpl::-webkit-scrollbar { display: none; } .tpl button { flex: none; border: 1px solid rgba(var(--rgb), .2); background: none; border-radius: 12px; padding: 5px 10px; font-size: 13px; }
  .mstatus .prog { margin: 8px 0 4px; }
  .link { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel2); border: 1px solid rgba(var(--rgb), .35); border-radius: 12px; padding: 9px 14px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.on { opacity: 1; }
  .login { max-width: 380px; margin: 40px auto; display: grid; gap: 10px; padding: 22px; border-radius: 20px; background: var(--panel); border: 1px solid rgba(var(--rgb), .2); }
  .login h1 { margin: 0; font-size: 21px; } .login p { margin: 0; color: var(--muted); font-size: 14px; } .login input { border: 1px solid rgba(var(--rgb), .3); background: rgba(0,0,0,.3); border-radius: 12px; padding: 12px; outline: none; }
  .login .err { color: var(--danger); font-size: 13px; min-height: 1em; } .login img { width: 64px; height: 64px; border-radius: 15px; }
  .note { font-size: 13px; color: var(--muted); }
  .obi { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(var(--rgb), .08); } .obi:first-of-type { border-top: 0; }
  .obi > div { flex: 1; min-width: 0; } .obi .obt { white-space: pre-wrap; max-height: 4.5em; overflow: hidden; font-size: 14px; } .obi a { color: var(--accent); font-size: 14px; word-break: break-all; } .obi small { display: block; color: var(--muted); font-size: 11px; }
  .obi button { border: 1px solid rgba(var(--rgb), .3); background: none; border-radius: 10px; padding: 5px 9px; font-size: 13px; color: var(--accent); flex: none; }
</style>
</head>
<body>
<header>
  <canvas id="hOrb" width="68" height="68"></canvas>
  <div class="t"><b>N28C</b><small id="sub">Companion</small></div>
  <span class="mac" id="mac"><i></i><span id="macTxt">Mac offline</span></span>
</header>
<main id="main">
  <section class="view on" id="v-chat"></section>
  <section class="view" id="v-chats"></section>
  <section class="view" id="v-study"></section>
  <section class="view" id="v-mac"></section>
  <section class="view" id="v-you"></section>
  <section class="view" id="v-login"></section>
</main>
<footer class="composer" id="composer">
  <div id="talkbar" hidden></div>
  <div id="typebar">
    <div class="photo" id="photo" hidden></div>
    <div class="featrow" id="featrow"></div>
    <div class="crow">
      <button class="agentbtn" id="agentBtn" title="Agent" aria-label="Choose agent"><i id="agentDot"></i></button>
      <div class="pill">
        <textarea id="q" rows="1" placeholder="Ask Nexus…"></textarea>
        <button class="pbtn" id="featBtn" title="@features" aria-label="Features">@</button>
        <button class="pbtn" id="attach" title="Add a photo" aria-label="Add a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="pbtn" id="mic" title="Dictate" aria-label="Dictate" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      </div>
      <button class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</footer>
<nav class="tabs" id="tabs" hidden>
  <button data-t="chat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chat</button>
  <button data-t="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Chats</button>
  <button data-t="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/></svg>Study<span class="badge" id="dueBadge" hidden></span></button>
  <button data-t="mac"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Mac</button>
  <button data-t="you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>You</button>
</nav>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
