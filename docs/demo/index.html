<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<title>Try Nexus '28</title>
<meta name="description" content="A hands-on demo of Nexus '28: switch agents, run a mission, take a quiz, flip flashcards and watch a huddle. Right in your browser.">
<meta property="og:image" content="../assets/og.png">
<link rel="icon" type="image/png" href="../companion/favicon.png">
<!-- The demo is scripted: nothing here calls an AI or sends what you type anywhere. It shows what the app does. -->
<style>
  :root { --accent: #3dffa0; --rgb: 61,255,160; --bg: #030c08; --panel: rgba(11,31,23,.72); --panel2: #102a20; --text: #e2fff1; --muted: #7fae99; --line: rgba(var(--rgb), .14);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  #bg { position: fixed; inset: 0; z-index: 0; transition: background 1.2s; background: radial-gradient(ellipse 60% 50% at 28% 45%, rgba(var(--rgb), .16), transparent 70%), radial-gradient(ellipse 40% 40% at 90% 100%, rgba(var(--rgb), .07), transparent 70%); }
  #stars { position: fixed; inset: 0; z-index: 0; opacity: .5; }
  .top { position: relative; z-index: 3; display: flex; align-items: center; gap: 14px; padding: 12px max(18px, env(safe-area-inset-left)); }
  .top a.brand { white-space: nowrap; display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--text); font: 700 13px var(--mono); letter-spacing: .24em; } .top img { width: 26px; height: 26px; border-radius: 7px; }
  .badge { font: 700 10px var(--mono); letter-spacing: .16em; color: #032313; background: var(--accent); border-radius: 6px; padding: 2px 7px; transition: background .6s; }
  .top .sp { flex: 1; } .top .links a { color: var(--muted); text-decoration: none; margin-left: 16px; font-size: 14px; } .top .links a.dl { color: #032313; background: var(--accent); padding: 6px 13px; border-radius: 10px; font-weight: 600; transition: background .6s; }
  .stage { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(380px, 560px); gap: 28px; height: calc(100% - 56px); padding: 0 max(18px, calc(50% - 640px)) 18px; }
  .left { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
  #orb { width: min(42vh, 420px); height: min(42vh, 420px); cursor: pointer; }
  .who { text-align: center; margin-top: 4px; } .who h1 { margin: 0; font-size: clamp(26px, 3.6vw, 40px); letter-spacing: -.02em; } .who h1 b { color: var(--accent); transition: color .6s; }
  .who p { margin: 4px 0 0; color: var(--muted); min-height: 1.5em; }
  .agents { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .agents button { border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 8%, transparent); color: var(--c); border-radius: 20px; padding: 6px 14px; font: 600 12px var(--mono); letter-spacing: .1em; cursor: pointer; transition: transform .15s, background .2s; }
  .agents button:hover { transform: translateY(-2px); } .agents button.on { background: var(--c); color: #04100b; box-shadow: 0 0 22px color-mix(in srgb, var(--c) 50%, transparent); }
  .skins { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; justify-content: center; } .skins button { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 14px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .skins button.on { color: var(--text); border-color: var(--accent); }
  .win { align-self: center; height: min(100%, 720px); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(22px) saturate(140%); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; } .bar span { margin-left: 8px; flex: 1; } .bar b { color: var(--accent); font: 600 11px var(--mono); letter-spacing: .1em; transition: color .6s; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg { max-width: 90%; animation: in .35s ease both; } .msg.me { align-self: flex-end; background: rgba(var(--rgb), .16); border: 1px solid rgba(var(--rgb), .25); border-radius: 16px 16px 4px 16px; padding: 8px 13px; }
  .msg.ai .name { font: 600 11px var(--mono); letter-spacing: .12em; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; } .msg.ai .name::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .msg.ai .body { color: var(--text); } .msg.ai .body p { margin: 0 0 8px; } .msg.ai .body p:last-child { margin: 0; }
  .caret { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; margin-left: 2px; }
  .think { display: flex; gap: 5px; padding: 6px 0; } .think span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bob 1.1s infinite; } .think span:nth-child(2) { animation-delay: .15s; } .think span:nth-child(3) { animation-delay: .3s; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } } @keyframes blink { 50% { opacity: 0; } } @keyframes bob { 40% { transform: translateY(-5px); opacity: 1; } 0%, 80%, 100% { opacity: .4; } }
  .w { margin-top: 10px; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 14px; padding: 12px; animation: in .4s ease both; }
  .w h4 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: .14em; color: var(--muted); }
  .quiz button { display: block; width: 100%; text-align: left; margin-top: 6px; border: 1px solid var(--line); background: rgba(var(--rgb), .04); border-radius: 10px; padding: 8px 11px; cursor: pointer; transition: background .2s, border-color .2s; }
  .quiz button:hover:not(:disabled) { border-color: var(--accent); } .quiz button.good { background: rgba(61,255,160,.2); border-color: #3dffa0; } .quiz button.bad { background: rgba(255,107,125,.16); border-color: #ff6b7d; }
  .quiz .fb { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .cards { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; } .cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 170px; height: 112px; perspective: 700px; cursor: pointer; } .card > div { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.3,1.4,.5,1); transform-style: preserve-3d; }
  .card.flip > div { transform: rotateY(180deg); } .card section { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; padding: 10px; display: grid; place-items: center; text-align: center; font-size: 14px; border: 1px solid var(--line); background: var(--panel2); }
  .card section + section { transform: rotateY(180deg); background: rgba(var(--rgb), .14); border-color: rgba(var(--rgb), .4); }
  .mission .step { display: flex; gap: 10px; align-items: center; padding: 5px 0; color: var(--muted); font-size: 14px; } .mission .step i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-style: normal; font-size: 11px; }
  .mission .step.run { color: var(--text); } .mission .step.run i { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; } .mission .step.done { color: var(--text); } .mission .step.done i { background: var(--accent); border-color: var(--accent); color: #032313; }
  .mission .prog { height: 5px; border-radius: 3px; background: rgba(255,255,255,.07); margin-top: 8px; overflow: hidden; } .mission .prog b { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s; box-shadow: 0 0 10px var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .huddle { display: grid; gap: 8px; } .huddle div { border-left: 3px solid var(--c); padding: 4px 10px; font-size: 14px; animation: in .4s ease both; } .huddle b { color: var(--c); font: 600 11px var(--mono); letter-spacing: .1em; display: block; }
  .chips { display: flex; gap: 6px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid var(--line); background: rgba(var(--rgb), .05); border-radius: 16px; padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: border-color .2s; } .chips button:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  form input { flex: 1; min-width: 0; background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; outline: none; font-size: 16px; } form input:focus { border-color: var(--accent); }
  form button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--accent); color: #032313; font-weight: 700; cursor: pointer; transition: background .6s; }
  form .mic { background: rgba(var(--rgb), .12); color: var(--accent); border: 1px solid var(--line); }
  .end { text-align: center; padding: 6px 0 2px; } .end a { display: inline-block; margin-top: 6px; background: var(--accent); color: #032313; text-decoration: none; font-weight: 700; padding: 8px 16px; border-radius: 12px; }
  @media (max-width: 900px) {
    html, body { overflow: auto; height: auto; } .top .links a:not(.dl) { display: none; } .top { gap: 10px; } .top .links a.dl { white-space: nowrap; margin: 0; padding: 6px 11px; font-size: 13px; }
    .stage { grid-template-columns: 1fr; height: auto; gap: 8px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    #orb { width: 220px; height: 220px; } .who h1 { font-size: 26px; } .agents { margin-top: 10px; } .skins { display: none; }
    .win { height: 72vh; min-height: 460px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="bg"></div><canvas id="stars"></canvas>
<div class="top"><a class="brand" href="../"><img src="../companion/icon-192.png" alt="">NEXUS '28</a><span class="badge">LIVE DEMO</span><span class="sp"></span>
  <span class="links"><a href="../">Home</a><a href="../whats-new/">What's new</a><a class="dl" href="https://github.com/apojidelegraphics/Nexus-28/releases/latest">Get the app</a></span></div>
<div class="stage">
  <div class="left">
    <canvas id="orb" title="Tap the orb"></canvas>
    <div class="who"><h1>Meet <b id="aname">@LYTE</b></h1><p id="atag">Edge-fast. Tap an agent, then ask it something.</p></div>
    <div class="agents" id="agents"></div>
    <div class="skins" id="skins"></div>
  </div>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i><span>Nexus '28 · demo chat</span><b id="bmode">READY</b></div>
    <div class="log" id="log"></div>
    <div class="chips" id="chips"></div>
    <form id="f"><button type="button" class="mic" id="mic" title="Talk mode (demo)">🎙</button><input id="q" placeholder="Ask @lyte anything… (it's a demo)" autocomplete="off" maxlength="200"><button>Send</button></form>
  </div>
</div>
<script src="../companion/orb.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const AGENTS = {
    lyte: { name: 'LYTE', color: '#3dffa0', tag: 'Edge-fast. Quick, sharp answers.', speed: 9 },
    flash: { name: 'FLASH', color: '#ffd36b', tag: 'Instant & clear. Explains like a great tutor.', speed: 7 },
    neodela: { name: 'NEODELA', color: '#b18cff', tag: 'Deep intelligence. Thinks it through.', speed: 5 },
    paragon: { name: 'PARAGON', color: '#5ce1ff', tag: 'The agentic flagship. Runs missions.', speed: 6 }
  };
  const SKINS = ['aurora', 'reactor', 'nebula', 'pulse', 'prism', 'pixel', 'eclipse', 'overlord'];
  let agent = 'lyte', busy = false;
  const orb = NexusOrb.create($('orb'), { color: AGENTS.lyte.color, skin: 'aurora' });

  // ---------- starfield
  const st = $('stars'), sx = st.getContext('2d'); let stars = [];
  function fitStars() { st.width = innerWidth * devicePixelRatio; st.height = innerHeight * devicePixelRatio; stars = Array.from({ length: 90 }, () => [Math.random(), Math.random(), Math.random() * 1.4 + .3, Math.random() * 6]); }
  fitStars(); addEventListener('resize', fitStars);
  (function tw(t) { sx.clearRect(0, 0, st.width, st.height); for (const [x, y, r, p] of stars) { sx.globalAlpha = .25 + .5 * Math.abs(Math.sin(t / 1400 + p)); sx.fillStyle = '#cfffe8'; sx.beginPath(); sx.arc(x * st.width, y * st.height, r * devicePixelRatio, 0, 7); sx.fill(); } requestAnimationFrame(tw); })(0);

  // ---------- agents + skins
  function hexRgb(h) { const n = parseInt(h.slice(1), 16); return `${n >> 16 & 255},${n >> 8 & 255},${n & 255}`; }
  function setAgent(id, say) {
    agent = id; const a = AGENTS[id];
    document.documentElement.style.setProperty('--accent', a.color); document.documentElement.style.setProperty('--rgb', hexRgb(a.color));
    orb.setColor(a.color); orb.pulse(.8);
    $('aname').textContent = '@' + a.name; $('atag').textContent = a.tag; $('q').placeholder = `Ask @${id} anything… (it's a demo)`;
    document.querySelectorAll('#agents button').forEach(b => b.classList.toggle('on', b.dataset.a === id));
    if (say) reply(`Hey, I'm @${id}. ${a.tag.split('.')[0]}. Try one of the buttons below!`, { quick: true });
  }
  $('agents').innerHTML = Object.entries(AGENTS).map(([k, a]) => `<button data-a="${k}" style="--c:${a.color}">@${a.name}</button>`).join('');
  $('agents').onclick = e => { const b = e.target.closest('button'); if (b && !busy) setAgent(b.dataset.a, true); };
  $('skins').innerHTML = SKINS.map((s, i) => `<button data-s="${s}" class="${i ? '' : 'on'}">${s}</button>`).join('');
  $('skins').onclick = e => { const b = e.target.closest('button'); if (!b) return; orb.setSkin(b.dataset.s); orb.pulse(1); document.querySelectorAll('#skins button').forEach(x => x.classList.toggle('on', x === b)); };
  $('orb').onclick = () => { orb.pulse(1); orb.setLevel(1); };

  // ---------- chat engine
  const log = $('log');
  const mode = m => { orb.setMode(m === 'ready' ? 'idle' : m); $('bmode').textContent = m.toUpperCase(); };
  function me(t) { log.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(t)}</div>`); log.scrollTop = log.scrollHeight; }
  function bubble(id = agent) { const a = AGENTS[id]; log.insertAdjacentHTML('beforeend', `<div class="msg ai"><div class="name" style="color:${a.color}">@${a.name}</div><div class="body"><div class="think"><span></span><span></span><span></span></div></div></div>`); log.scrollTop = log.scrollHeight; return log.lastElementChild.querySelector('.body'); }
  async function stream(el, text, speed) {
    const paras = text.split('\n\n'); el.innerHTML = '';
    for (const p of paras) {
      const pe = document.createElement('p'); el.appendChild(pe);
      const words = p.split(/(\s+)/);
      for (let i = 0; i < words.length; i++) { pe.innerHTML = esc(words.slice(0, i + 1).join('')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '<span class="caret"></span>'; if (i % 3 === 0) orb.setLevel(.4 + Math.random() * .5); log.scrollTop = log.scrollHeight; await wait(90 / speed + Math.random() * 30); }
      pe.innerHTML = esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    }
  }
  async function reply(text, { quick, widget, as } = {}) {
    busy = true; const id = as || agent; mode('thinking');
    const el = bubble(id); await wait(quick ? 350 : 700 + Math.random() * 500);
    mode('speaking'); await stream(el, text, AGENTS[id].speed * (quick ? 1.6 : 1));
    if (widget) { el.insertAdjacentHTML("beforeend", widget.html); await widget.mount?.(el.lastElementChild); }
    log.scrollTop = log.scrollHeight; mode('ready'); busy = false; return el;
  }

  // ---------- scripted demos
  const QUIZ = [['What does the Calvin cycle make?', ['Oxygen', 'Glucose (sugar)', 'Water', 'Chlorophyll'], 1, 'Right: the Calvin cycle uses ATP and NADPH to fix CO₂ into sugar.'],
                ['Where do the light reactions happen?', ['Thylakoid membranes', 'Mitochondria', 'Cell wall', 'Nucleus'], 0, 'Yep, in the thylakoids, inside the chloroplast.']];
  function quizWidget(i = 0, score = 0) {
    const [q, ch, ans, why] = QUIZ[i];
    return { html: `<div class="w quiz"><h4>QUIZ · ${i + 1} OF ${QUIZ.length}</h4><b>${esc(q)}</b>${ch.map((c, k) => `<button data-k="${k}">${esc(c)}</button>`).join('')}<div class="fb"></div></div>`,
      mount(w) { w.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; const k = +b.dataset.k;
        w.querySelectorAll('button').forEach((x, j) => { x.disabled = true; if (j === ans) x.classList.add('good'); else if (j === k) x.classList.add('bad'); });
        const s = score + (k === ans); orb.pulse(k === ans ? 1 : .3);
        w.querySelector('.fb').innerHTML = (k === ans ? '✅ ' : '❌ ') + esc(k === ans ? why : `It's "${ch[ans]}". ${why.replace(/^\w+[:,] ?/, '')}`) + ' <b style="color:var(--accent)">+5 points</b>';
        if (i + 1 < QUIZ.length) setTimeout(() => reply('Next one:', { quick: true, widget: quizWidget(i + 1, s) }), 900);
        else setTimeout(() => reply(`You got **${s} of ${QUIZ.length}**. ${s === QUIZ.length ? 'Perfect! 🔥 Your streak just grew.' : "Nice. I'll bring back the one you missed tomorrow."} In the app, every quiz goes into your study stats and spaced-repetition schedule.`, { quick: true }), 900);
      }; } };
  }
  const CARDS = [['Mitochondria', 'Makes ATP through cellular respiration'], ['Osmosis', 'Water moving across a membrane toward more solute'], ['Ribosome', 'Builds proteins from mRNA'], ['Enzyme', 'A protein that speeds up a reaction'], ['Diffusion', 'Particles spreading from high to low concentration']];
  const cardsWidget = { html: `<div class="w"><h4>NEW DECK · BIO UNIT 3 · ${CARDS.length} CARDS · TAP TO FLIP</h4><div class="cards">${CARDS.map(([f, b]) => `<div class="card"><div><section><b>${esc(f)}</b></section><section>${esc(b)}</section></div></div>`).join('')}</div></div>`,
    mount(w) { w.onclick = e => { const c = e.target.closest('.card'); if (c) { c.classList.toggle('flip'); orb.pulse(.4); } }; } };
  const huddleWidget = { html: '<div class="w"><h4>HUDDLE · 3 AGENTS</h4><div class="huddle"></div></div>',
    async mount(w) { const h = w.querySelector('.huddle'); const lines = [['flash', 'Short sessions, every day. 25 minutes beats a 4-hour cram.'], ['neodela', "Test yourself instead of rereading. Retrieval is what makes it stick."], ['paragon', "Space it out: review a deck 1, 3 and 7 days after you learn it. I'll schedule it into your free time."]];
      for (const [id, t] of lines) { await wait(700); h.insertAdjacentHTML('beforeend', `<div style="--c:${AGENTS[id].color}"><b>@${AGENTS[id].name}</b>${esc(t)}</div>`); orb.setColor(AGENTS[id].color); orb.pulse(.6); log.scrollTop = log.scrollHeight; }
      await wait(600); orb.setColor(AGENTS[agent].color); } };
  const missionWidget = { html: `<div class="w mission"><h4>MISSION · RESEARCH → OUTLINE → DRAFT</h4>${['Searching 14 sources', 'Reading and taking notes', 'Checking facts against each other', 'Writing the outline', 'Drafting the essay', 'Adding citations'].map(s => `<div class="step"><i></i>${s}</div>`).join('')}<div class="prog"><b></b></div></div>`,
    async mount(w) { const steps = [...w.querySelectorAll('.step')]; mode('thinking');
      for (let i = 0; i < steps.length; i++) { steps[i].className = 'step run'; w.querySelector('.prog b').style.width = (i / steps.length * 100) + '%'; await wait(900 + Math.random() * 700); steps[i].className = 'step done'; steps[i].querySelector('i').textContent = '✓'; orb.pulse(.5); }
      w.querySelector('.prog b').style.width = '100%'; mode('ready');
      await reply("Mission complete. 🎯 Your report has a 3-part outline, a 900-word draft and 9 citations, all saved in your Project. In the real app you'd get a notification on your Mac and your phone, even if you'd walked away.", { quick: true, as: 'paragon' }); } };
  const SCRIPTS = [
    { chip: '🧠 Quiz me on photosynthesis', match: /quiz|test me|photosynth/i, run: () => reply("Let's go. Two questions on photosynthesis, tap your answer:", { widget: quizWidget() }) },
    { chip: '🃏 Make flashcards from my notes', match: /flash ?card|deck|cards/i, run: () => reply("I turned your Bio notes into a deck. In the app you can also photograph handwritten notes with N28C and get the same thing.", { widget: cardsWidget }) },
    { chip: '🎯 Run a mission', match: /mission|research|essay|report/i, run: () => { setAgent('paragon'); return reply('On it. I chained three missions: research, then outline, then draft. Watch:', { widget: missionWidget }); } },
    { chip: '◍ Huddle: how should I study?', match: /huddle|how (should|do) i study|study tips/i, run: () => reply('I asked the crew. Here is what they said:', { widget: huddleWidget }) },
    { chip: '⏱ Start a focus timer', match: /focus|pomodoro|timer/i, run: focusDemo },
    { chip: '📝 Take meeting notes', match: /meeting|notes|lecture|record/i, run: () => reply("In the app I'd record the lecture, show the transcript as it goes, then give you:\n\n**Summary:** cell transport, passive vs. active.\n\n**Action items:** read pages 112–118 by Thursday; lab write-up due Monday. One tap sends them to Apple Reminders.") }
  ];
  async function focusDemo() {
    await reply("Focus mode on. 🍅 Notifications are held, and the orb turns into your timer. (In the app it's 25 minutes; here it's 10 seconds.)", { quick: true });
    busy = true; const old = AGENTS[agent].color; orb.setColor('#ffb347'); orb.setMode('thinking');
    for (let s = 10; s > 0; s--) { $('bmode').textContent = `FOCUS 0:${String(s).padStart(2, '0')}`; orb.setLevel(.3); await wait(1000); }
    orb.setColor(old); busy = false; mode('ready'); orb.pulse(1);
    await reply("Done! **+5 points** and the 'In the zone' achievement is closer. Take a 5 minute break.", { quick: true });
  }
  $('chips').innerHTML = SCRIPTS.map((s, i) => `<button data-i="${i}">${s.chip}</button>`).join('');
  $('chips').onclick = e => { const b = e.target.closest('button'); if (!b || busy) return; me(b.textContent); SCRIPTS[+b.dataset.i].run(); };
  let free = 0;
  $('f').onsubmit = e => {
    e.preventDefault(); const t = $('q').value.trim(); if (!t || busy) return; $('q').value = ''; me(t);
    const at = t.match(/@(lyte|flash|neodela|paragon)\b/i); if (at) setAgent(at[1].toLowerCase());
    const s = SCRIPTS.find(x => x.match.test(t)); if (s) return s.run();
    free++;
    reply(free < 3 ? `This is a demo, so I can't really answer "${t.slice(0, 60)}", but in the app @${agent} would, with web search, your files, your screen and your calendar if you let it. Try one of the buttons below to see what I can do.`
      : "You've got the idea. 😄 The real thing is free:", free < 3 ? {} : { widget: { html: '<div class="w end">Nexus \'28 for Mac + N28C on your phone<br><a href="https://github.com/apojidelegraphics/Nexus-28/releases/latest">Download Nexus \'28</a></div>' } });
  };
  $('mic').onclick = async () => {
    if (busy) return; busy = true; mode('listening'); $('q').placeholder = 'Listening…';
    for (let i = 0; i < 16; i++) { orb.setLevel(Math.random()); await wait(120); }
    busy = false; $('q').placeholder = `Ask @${agent} anything… (it's a demo)`; me('🎙 "What\'s on my plate today?"');
    reply("You've got a Bio quiz at 2, and 12 cards due. I put a 20 minute review in your free slot at 11:40. Want me to start it? (In the app, talk mode listens and answers out loud.)");
  };
  setAgent('lyte');
  setTimeout(() => reply("Welcome to the Nexus '28 demo! 👋 I'm @lyte. Pick an agent, change the orb's skin, or tap a button below. Nothing you type leaves this page.", { quick: true }), 500);
})();
</script>
